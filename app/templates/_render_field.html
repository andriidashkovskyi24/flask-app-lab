{% macro render_field(field) %}
<div class="mb-3">
    {{ field.label(class="form-label") }}
    {{ field(class="form-control", **kwargs) | safe }}
    
    {% if field.errors %}
        <ul class="list-unstyled mt-1">
        {% for error in field.errors %}
            <li class="text-danger small">{{ error }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</div>
{% endmacro %}
